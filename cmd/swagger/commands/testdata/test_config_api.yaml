version: "1.0"

definitions:
  User:
    name: "User"
    fields:
      - name: "Id"
        type: "string"
        json: "id"
      - name: "Email"
        type: "string"
        json: "email"
      - name: "Created_at"
        type: "time.Time"
        json: "created_at"

  Product: 
    name: "Product"
    fields:
      - name: "Id"
        type: "string"
        json: "id"
      - name: "Title"
        type: "string"
        json: "title"
      - name: "Price"
        type: "float64"
        json: "price"

paths:
    /users:
      get:
        summary: List all users
        operationId: listUsers
        produces:
          - application/json
        responses:
          200:
            description: A list of users
            schema:
              type: array
              items:
                $ref: "#/definitions/User"
      post:
        summary: Create a new user
        operationId: createUser
        produces:
          - application/json
        responses:
          201:
            description: The created user
            schema:
              type: object
              $ref: "#/definitions/User"

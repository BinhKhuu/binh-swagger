version: "1.0"
project_root: "./testdata"

models:
  user:
    name: "User"
    fields:
      - name: "id"
        type: "string"
        json: "id"
      - name: "email"
        type: "string"
        json: "email"
      - name: "created_at"
        type: "time.Time"
        json: "created_at"

  product: 
    name: "Product"
    fields:
      - name: "id"
        type: "string"
        json: "id"
      - name: "title"
        type: "string"
        json: "title"
      - name: "price"
        type: "float64"
        json: "price"

paths:
    /users:
      get:
        summary: List all users
        operationId: listUsers
        produces:
          - application/json
        responses:
          200:
            description: A list of users
            schema:
              type: array
      post:
        summary: Create a new user
        operationId: createUser
        produces:
          - application/json
        responses:
          201:
            description: The created user
            schema:
              $ref: "#/definitions/User"

routes:
  - path: "/users"
    method: "GET"
    model: "User"

  - path: "/products"
    method: "POST"
    model: "Product"

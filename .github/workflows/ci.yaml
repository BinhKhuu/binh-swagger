name: Build Go project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Goß
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: run golanglint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.59.1

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

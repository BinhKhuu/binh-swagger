name: Build Go project

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.24

      - name: Force Go to use local toolchain
        run: go env -w GOTOOLCHAIN=local

      - name: Verify Go toolchain
        run: |
          echo "which go:"
          which go
          echo "go version:"
          go version
          echo "GOROOT:"
          go env GOROOT
          echo "GOTOOLCHAIN:"
          go env GOTOOLCHAIN

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v2.0.0
          only-new-issues: true
          skip-cache: true

      - name: Build
        run: go build ./...

      - name: Run tests with classic coverage
        run: go test ./... -v -coverprofile=coverage.out

      - name: Add coverage summary to job summary
        run: |
          {
            echo "## Test Coverage"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
